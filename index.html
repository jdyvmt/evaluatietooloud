<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluatietool & Rubrics</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- Bovenbalk & Navigatie -->
  <header class="navbar">
    <div class="nav-brand">
      <h2>Evaluatietool</h2>
    </div>
    <nav class="nav-menu">
      <button id="nav-eval" class="nav-link active">Evaluatie</button>
      <button id="nav-dashboard" class="nav-link">Opdrachten & Rubrics</button>
      <button id="nav-classes" class="nav-link">Klassenbeheer</button>
    </nav>
  </header>

  <!-- SCHERM 1: EVALUATIEMODUS -->
  <section id="screen-eval" class="app-screen active">
    <div class="layout-grid">
      <!-- Zijbalk Selectie -->
      <aside class="sidebar-card">
        <h3>Selectie</h3>
        <div class="field-group">
          <label for="eval-task-select">Opdracht:</label>
          <select id="eval-task-select"></select>
        </div>
        <div class="field-group">
          <label for="eval-class-select">Klas:</label>
          <select id="eval-class-select"></select>
        </div>

        <h3 class="mt-3">Leerlingen</h3>
        <ul id="eval-student-list" class="selectable-list"></ul>
      </aside>

      <!-- Hoofdvenster Evaluatie -->
      <main class="main-card">
        <div class="eval-header-info">
          <h2 id="eval-student-title">Selecteer een leerling</h2>
          <span id="eval-task-subtitle" class="badge">Opdracht: -</span>
        </div>

        <div id="eval-rubrics-wrapper"></div>

        <div class="card-section mt-3">
          <h3>Algemene Feedback & Opmerkingen</h3>
          <textarea id="eval-general-feedback" placeholder="Automatisch gegenereerde en/of eigen feedback..."></textarea>
        </div>

        <div class="button-bar">
          <button id="btn-save-evaluation" class="btn btn-primary">Evaluatie Opslaan</button>
          <button id="btn-export-pdf" class="btn btn-secondary">Exporteer als PDF</button>
        </div>
      </main>
    </div>
  </section>

  <!-- SCHERM 2: DASHBOARD (OPDRACHTEN & RUBRICS) -->
  <section id="screen-dashboard" class="app-screen">
    <div class="layout-grid">
      <!-- Zijbalk Opdrachten -->
      <aside class="sidebar-card">
        <div class="sidebar-header">
          <h3>Opdrachten</h3>
          <button id="btn-add-task" class="btn btn-sm btn-primary">+ Nieuw</button>
        </div>
        <ul id="dashboard-task-list" class="selectable-list"></ul>
      </aside>

      <!-- Hoofdvenster Opdracht Editor -->
      <main class="main-card">
        <h2>Opdracht & Rubrics Bewerken</h2>
        
        <div class="field-group">
          <label for="task-name-input">Titel van de opdracht:</label>
          <input type="text" id="task-name-input" placeholder="Bijv. Spreken: Presentatie">
        </div>

        <hr class="separator">

        <div class="section-header">
          <h3>Criteria & Evaluatieniveaus</h3>
          <button id="btn-add-criterion" class="btn btn-sm btn-secondary">+ Criterium Toevoegen</button>
        </div>

        <div id="editor-criteria-container"></div>

        <div class="button-bar mt-3">
          <button id="btn-save-task-changes" class="btn btn-primary">Wijzigingen Opslaan</button>
          <button id="btn-delete-task" class="btn btn-danger">Opdracht Verwijderen</button>
        </div>
      </main>
    </div>
  </section>

  <!-- SCHERM 3: KLASSENBEHEER -->
  <section id="screen-classes" class="app-screen">
    <div class="layout-grid">
      <aside class="sidebar-card">
        <div class="sidebar-header">
          <h3>Klassen</h3>
          <button id="btn-add-class" class="btn btn-sm btn-primary">+ Nieuw</button>
        </div>
        <ul id="classes-class-list" class="selectable-list"></ul>
      </aside>

      <main class="main-card">
        <h2>Klas & Leerlingen Beheren</h2>
        <div class="field-group">
          <label for="class-name-input">Klasnaam:</label>
          <input type="text" id="class-name-input" placeholder="Bijv. 4 LA">
        </div>

        <hr class="separator">

        <div class="field-group">
          <label for="class-students-input">Leerlingen (één naam per regel):</label>
          <textarea id="class-students-input" rows="10" placeholder="Jan Peeters&#10;Sophie Devos&#10;Lucas Janssens"></textarea>
        </div>

        <div class="button-bar mt-3">
          <button id="btn-save-class-changes" class="btn btn-primary">Klas Opslaan</button>
          <button id="btn-delete-class" class="btn btn-danger">Klas Verwijderen</button>
        </div>
      </main>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
