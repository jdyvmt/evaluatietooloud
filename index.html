<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluatietool</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <header class="app-header">
    <h1>Evaluatietool</h1>
    <nav class="mode-switch">
      <button id="btn-mode-eval" class="nav-btn active">Evaluatie</button>
      <button id="btn-mode-admin" class="nav-btn">Beheer & Rubrics</button>
    </nav>
  </header>

  <!-- EVALUATIEMODUS -->
  <main id="view-evaluation" class="view-section active">
    <div class="eval-container">
      <aside class="sidebar">
        <h2>Leerlingen</h2>
        <div class="form-group">
          <label for="select-klas">Kies klas:</label>
          <select id="select-klas"></select>
        </div>
        <ul id="student-list" class="student-list"></ul>
      </aside>

      <section class="eval-content">
        <div id="eval-header" class="eval-card">
          <h2 id="current-student-name">Selecteer een leerling</h2>
          <p id="current-task-info">Opdracht: -</p>
        </div>

        <div id="rubric-container" class="rubric-container"></div>

        <div class="eval-card">
          <h3>Algemene Feedback</h3>
          <textarea id="general-feedback" placeholder="Typ hier algemene opmerkingen..."></textarea>
        </div>

        <div class="action-bar">
          <button id="btn-save" class="btn primary">Opslaan</button>
          <button id="btn-pdf" class="btn secondary">Exporteer PDF</button>
        </div>
      </section>
    </div>
  </main>

  <!-- BEHEERMODUS -->
  <main id="view-admin" class="view-section">
    <div class="admin-container">
      <h2>Beheermodus</h2>
      <p>Pas hier je opdrachten, criteria en niveaus aan.</p>
      
      <div class="admin-card">
        <h3>Opdracht & Criteria Bewerken</h3>
        <div class="form-group">
          <label for="admin-task-title">Titel Opdracht:</label>
          <input type="text" id="admin-task-title" placeholder="Bijv. Spreken: Presentatie">
        </div>

        <div id="admin-criteria-list"></div>

        <button id="btn-add-criterion" class="btn secondary">+ Criterium Toevoegen</button>
      </div>

      <div class="action-bar">
        <button id="btn-save-admin" class="btn primary">Wijzigingen Opslaan</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
