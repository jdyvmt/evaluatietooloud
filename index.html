<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluatietool</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <header class="app-header">
    <h1>Evaluatietool</h1>
    <nav class="mode-switch">
      <button id="btn-view-eval" class="nav-btn active">Evaluatie</button>
      <button id="btn-view-admin" class="nav-btn">Beheer & Opdrachten</button>
    </nav>
  </header>

  <!-- EVALUATIEMODUS -->
  <main id="view-eval" class="view-section active">
    <div class="eval-container">
      <aside class="sidebar">
        <h2>Selectie</h2>
        <div class="form-group">
          <label for="select-task-eval">Opdracht:</label>
          <select id="select-task-eval"></select>
        </div>
        <div class="form-group">
          <label for="select-klas-eval">Klas:</label>
          <select id="select-klas-eval"></select>
        </div>
        <h3>Leerlingen</h3>
        <ul id="student-list" class="student-list"></ul>
      </aside>

      <section class="eval-content">
        <div class="eval-card">
          <h2 id="current-student-name">Selecteer een leerling</h2>
          <p id="current-task-name">Opdracht: -</p>
        </div>

        <div id="rubric-container"></div>

        <div class="eval-card">
          <h3>Feedback & Opmerkingen</h3>
          <textarea id="general-feedback" placeholder="Geselecteerde feedback verschijnt hier..."></textarea>
        </div>

        <div class="action-bar">
          <button id="btn-save-eval" class="btn primary">Evaluatie Opslaan</button>
          <button id="btn-pdf-eval" class="btn secondary">Exporteer PDF</button>
        </div>
      </section>
    </div>
  </main>

  <!-- BEHEERMODUS -->
  <main id="view-admin" class="view-section">
    <div class="admin-container">
      <div class="admin-sidebar">
        <h2>Opdrachten</h2>
        <button id="btn-new-task" class="btn primary small">+ Nieuwe Opdracht</button>
        <ul id="admin-task-list" class="admin-list"></ul>

        <h2 class="mt-4">Klassen & Leerlingen</h2>
        <button id="btn-new-klas" class="btn secondary small">+ Nieuwe Klas</button>
        <ul id="admin-klas-list" class="admin-list"></ul>
      </div>

      <div class="admin-editor">
        <div id="task-editor-card" class="admin-card">
          <h2 id="editor-title">Opdracht Bewerken</h2>
          <div class="form-group">
            <label for="task-title-input">Titel Opdracht:</label>
            <input type="text" id="task-title-input" placeholder="Bijv. Spreken: Presentatie">
          </div>

          <hr class="divider">

          <div class="criteria-header">
            <h3>Criteria & Niveaus</h3>
            <button id="btn-add-criterion" class="btn secondary small">+ Criterium Toevoegen</button>
          </div>

          <div id="criteria-editor-container"></div>

          <div class="action-bar mt-4">
            <button id="btn-save-task" class="btn primary">Opdracht Opslaan</button>
            <button id="btn-delete-task" class="btn danger">Opdracht Verwijderen</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
