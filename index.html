<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluatietool - Beoordelingsscherm</title>
  <link rel="stylesheet" href="style.css">
  <!-- Bibliotheek voor PDF-generatie -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- Bovenbalk -->
  <header class="topbar">
    <div class="context-info">
      <span class="badge" id="klas-badge">4 Latijn</span>
      <h2 id="opdracht-titel">Opdracht: Uiteenzetting Structuur & Taal</h2>
    </div>
    <div class="topbar-actions">
      <label>
        <input type="checkbox" id="filter-uncompleted"> Enkel onvolbrachte leerlingen
      </label>
      <button class="btn-secondary" id="btn-export-pdf" onclick="exporteerKlasPDF('K-4LA', 'OPD-01')">📄 Exporteer Klas-PDF</button>
    </div>
  </header>

  <!-- Hoofdgrid: 3 Kolommen -->
  <main class="eval-grid">

    <!-- Kolom 1: Leerling & Historiek -->
    <aside class="panel history-panel">
      <h3>Leerling & Progressie</h3>
      
      <div class="form-group">
        <label for="student-select">Selecteer leerling:</label>
        <select id="student-select"></select>
      </div>

      <div class="history-card" id="history-container">
        <!-- Historiek wordt hier dynamisch ingeladen -->
      </div>
    </aside>

    <!-- Kolom 2: Criteria & Rubrics -->
    <section class="panel criteria-panel" id="criteria-container">
      <h3>Criteria</h3>
      <!-- Criteria en niveaus worden hier dynamisch ingeladen -->
    </section>

    <!-- Kolom 3: Feedback & Acties -->
    <aside class="panel feedback-panel">
      <h3>Snel-feedback</h3>

      <div class="quick-feedback-list" id="quick-feedback-container">
        <!-- Vinkjes worden hier dynamisch ingeladen -->
      </div>

      <div class="form-group margin-top">
        <label for="free-feedback">Vrije feedback:</label>
        <textarea id="free-feedback" rows="4" placeholder="Typ hier specifieke opmerkingen..."></textarea>
      </div>

      <div class="action-footer">
        <button class="btn-primary" id="btn-save">Opslaan & Volgende (→)</button>
      </div>
    </aside>

  </main>

  <script src="app.js"></script>
</body>
</html>
